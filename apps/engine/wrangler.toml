name = "openwa-engine"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Durable Object class (WhatsApp session host)
[[durable_objects.bindings]]
name = "SESSION_HOST"
class_name = "WhatsAppSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsAppSessionDO"]

[env.staging]
name = "openwa-engine-staging"

[env.production]
name = "openwa-engine-production"

# ---------------- self-host (single-tenant) ----------------
[env.self-host]
name = "openwa-engine"

[[env.self-host.durable_objects.bindings]]
name = "SESSION_HOST"
class_name = "WhatsAppSessionDO"

[[env.self-host.migrations]]
tag = "v1"
new_sqlite_classes = ["WhatsAppSessionDO"]
