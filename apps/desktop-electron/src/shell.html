<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenWA</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <style>
      :root {
        --bg: #0b141a;
        --bg-2: #111b21;
        --bg-3: #1f2c33;
        --fg: #e9edef;
        --fg-dim: #8696a0;
        --accent: #25d366;
        --accent-2: #008069;
        --border: #2a3942;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      body { display: flex; }
      aside.sidebar {
        width: 72px; height: 100vh;
        background: var(--bg-2);
        border-right: 1px solid var(--border);
        display: flex; flex-direction: column; align-items: center;
        padding: 10px 0;
        gap: 6px;
      }
      .acct {
        width: 48px; height: 48px; border-radius: 50%;
        display: grid; place-items: center;
        background: var(--bg-3); color: var(--fg);
        cursor: pointer; user-select: none;
        font-weight: 600; font-size: 16px;
        position: relative;
        transition: background 0.15s, transform 0.1s;
        border: 2px solid transparent;
      }
      .acct:hover { background: #2a3a44; }
      .acct.active { border-color: var(--accent); }
      .acct .ring {
        position: absolute; inset: -2px;
        border-radius: 50%; pointer-events: none;
      }
      .acct .ctx {
        position: absolute; top: -4px; right: -4px;
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--bg);
        color: var(--fg-dim);
        display: none; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700;
        cursor: pointer;
      }
      .acct:hover .ctx { display: flex; }
      .add {
        width: 48px; height: 48px; border-radius: 50%;
        display: grid; place-items: center;
        background: transparent; color: var(--fg-dim);
        cursor: pointer; font-size: 22px;
        border: 1px dashed var(--border);
        margin-top: auto;
      }
      .add:hover { color: var(--accent); border-color: var(--accent); }
      .tip {
        position: fixed; left: 84px; background: var(--bg-3);
        padding: 6px 10px; border-radius: 6px; font-size: 12px;
        pointer-events: none; opacity: 0; transition: opacity 0.1s;
        white-space: nowrap; z-index: 99;
      }
      .tip.show { opacity: 1; }
      .container { flex: 1; }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="container"></div>
    <div id="tip" class="tip"></div>
    <script src="shell.js"></script>
  </body>
</html>
