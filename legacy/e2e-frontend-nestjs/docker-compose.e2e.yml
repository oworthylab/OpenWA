# E2E Test Environment - Mirrors Production
# Dashboard: nginx serving built static files + API proxy
# Backend: node dist/main in production mode
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up --build -d
#   npx playwright test
#   docker compose -f docker-compose.e2e.yml down

services:
  # Backend API (production mode)
  openwa-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: openwa-e2e-api
    restart: "no"
    expose:
      - "2785"
    environment:
      - NODE_ENV=production
      - PORT=2785
      - LOG_LEVEL=warn
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - DATABASE_SYNCHRONIZE=true
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - REDIS_ENABLED=false
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=200
      - PLUGINS_ENABLED=true
      - PLUGINS_DIR=/app/data/plugins
      - DEFAULT_ADMIN_KEY=e2e-admin-key
    volumes:
      - e2e-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Dashboard (production nginx build, like real deployment)
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: openwa-e2e-dashboard
    restart: "no"
    ports:
      - "127.0.0.1:2886:80"
    volumes:
      - ./nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      openwa-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  e2e-data:
